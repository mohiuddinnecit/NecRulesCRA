(()=>{'use strict';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clone=x=>JSON.parse(JSON.stringify(x));const EVIDENCE_OPTIONS=['Basic KYC','Full KYC','ID verification','Transaction screening','Proof of address / second ID','Source of funds (SOF)','Source of wealth (SOW)','Beneficiary / counterparty review','Transfer purpose / economic rationale','Payer / account ownership','Device / step-up verification','Expected activity baseline','Enhanced due diligence','Manual Compliance review'];
const RESPONSE_OPTIONS=['Create alert','Request documents','Queue manual review','Hold pending review','Reject where legally required','Step-up verification','Escalate to MLRO','Restrict product access','Review partner exposure','Update risk assessment','Create QA task'];
function recommendedEvidence(r){let id=r.id,txt=String(r.requirements||'').toLowerCase(),a=[];if(/basic kyc/.test(txt))a.push('Basic KYC');if(/full kyc|reverify kyc/.test(txt))a.push('Full KYC');if(/screening/.test(txt))a.push('Transaction screening');if(/poa|second id|proof of address/.test(txt))a.push('Proof of address / second ID');if(/sof|source of funds/.test(txt))a.push('Source of funds (SOF)');if(/sow|source of wealth/.test(txt))a.push('Source of wealth (SOW)');if(/counterpart|beneficiar|recipient/.test(txt))a.push('Beneficiary / counterparty review');if(/purpose|economic/.test(txt))a.push('Transfer purpose / economic rationale');if(/payer|ownership/.test(txt))a.push('Payer / account ownership');if(/device|step-up/.test(txt))a.push('Device / step-up verification');if(/expected|baseline/.test(txt))a.push('Expected activity baseline');if(/edd|enhanced/.test(txt))a.push('Enhanced due diligence');if(id==='R01'){a=['Basic KYC','Transaction screening','Full KYC']}if(id==='M01'||id==='M02')a.push('Manual Compliance review');return [...new Set(a)]}
function recommendedResponses(r){let id=r.id;if(id==='M01')return ['Queue manual review','Update risk assessment'];if(id==='M02')return ['Create QA task'];let a=['Create alert'];if(['R03','R04','R05','R06','R07','R11','R12','R14','R15','R18','R20'].includes(id))a.push('Request documents');if(id==='R19')a.push('Step-up verification','Queue manual review');if(id==='R01')a.push('Request documents');return a}
function optionGroup(r,kind,items){let values=Array.isArray(r[kind])?r[kind]:(kind==='evidenceOptions'?recommendedEvidence(r):recommendedResponses(r));return `<div class="req-box"><h3>${kind==='evidenceOptions'?'DOCUMENTS & EVIDENCE REQUIRED':'RESPONSE WHEN RULE TRIGGERS'}</h3><div class="req-options">${items.map((x,i)=>`<label class="req-option"><input type="checkbox" class="${kind==='evidenceOptions'?'evidence-check':'response-check'}" value="${esc(x)}" ${values.includes(x)?'checked':''} ${edit?'':'disabled'}><span>${esc(x)}</span></label>`).join('')}</div><div class="req-note">Suggested selections are derived from the Word rule requirements. Review and approve before operational use. A tick records a requirement; it does not verify evidence or execute a payment hold.</div></div>`}
const key='NEC_RULE_STUDIO_V26_DYNAMIC_CRA_SCORE_TX';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.rules)){state={rules:clone(SEED.source.rules),transactions:clone(SEED.source.transactions),cra:clone(SEED.cra),audit:[],tests:[],decisions:[]};}state.audit??=[];state.tests??=[];state.decisions??=[];state.cra??=clone(SEED.cra);state.testScenario??={amount:'100.01',product:'P2P',kyc:'Basic KYC',screen:'Clear',enhanced:'Not verified',other:'No',fields:{}};let tab='Dashboard',selected='R01',edit=false,txIndex=0,craIndex=0,search='';const EXPLAIN_RULES=[["R01", "P2P above £100 — NEC proposed override", "P2P single amount > £100. The Word document originally calls R01 the small-transfer rule (≤£100); the above-£100 alert is your requested override.", "Raise an R01 alert for £100.01 or more. Hold if Full KYC is not verified. Full KYC verified resolves this amount-only hold, subject to screening and other applicable restrictions.", "Basic KYC, screening; Full KYC for release.", "£100.00: no R01 override alert. £100.01 Basic KYC: HIT/HOLD. £100.01 Full KYC: HIT/release eligible."], ["R02", "Repeated P2P transfers", "At least 2 qualifying P2P transfers by one sender in rolling 24 hours AND combined amount > £200.", "Review repeated payments and beneficiary details. Exactly £200 does not trigger.", "Basic KYC, transfer purpose, frequency and recipient information.", "£110 + £100 in 24h: HIT. Two transfers totalling £200: CLEAR."], ["R03", "Single P2P £100.01–£3,000", "Single P2P amount > £100 AND ≤ £3,000.", "Require Full KYC; if not verified, the above-£100 hold remains.", "Full KYC.", "£500: HIT; £3,000: HIT; £3,000.01: R04 instead."], ["R04", "Large single P2P", "Single P2P amount > £3,000, without a proposed upper cap.", "Apply enhanced verification. Full KYC alone does not satisfy all R04 requirements.", "Full KYC, proof of address or acceptable second ID, source of funds.", "£3,500: HIT; release only after required enhanced checks and other controls."], ["R05", "P2P 24-hour cumulative value", "Sum qualifying P2P transfers for same sender in rolling 24 hours; total ≥ £5,000.", "Evaluate P2P-only ledger, not wallet/FX movements.", "Full KYC, proof of address or second ID.", "£2,000 + £3,500 in 24h: HIT."], ["R06", "P2P seven-day cumulative value", "Sum qualifying P2P transfers for same sender over rolling 168 hours; total ≥ £10,000.", "Review cumulative exposure and enhanced evidence.", "Full KYC, proof of address or second ID, source of funds.", "£4,000 + £3,000 + £4,000 in 7d: HIT."], ["R07", "P2P 30-day cumulative value", "Sum qualifying P2P transfers over rolling 720 hours; total ≥ £20,000.", "Review sustained high-value activity.", "Full KYC, proof of address or second ID, source of funds.", "Five transfers of £4,500 within 30d: HIT."], ["R08", "P2P transfer frequency", "At least 5 qualifying P2P transfers for one sender in rolling 24 hours.", "Detect rapid transfers regardless of individual value.", "Full KYC; proof of address/second ID and SOF if unexplained.", "Five £50 P2P transfers in 24h: HIT."], ["R09", "Distinct beneficiaries", "Count distinct verified beneficiaries used by a sender in rolling 7 days. Source example triggers review for 5 different beneficiaries; earlier Excel catalogue proposes review ≥4 and escalation ≥10.", "The 4/10 settings are a catalogue proposal, not fully specified by the Word document. Confirm the final thresholds with Compliance.", "Full KYC; proof of address/second ID and SOF on escalation.", "Five different recipients in 7d: review."], ["R10", "Activity versus expected volume", "Compare rolling 30-day actual qualifying transfer volume with approved expected 30-day baseline. Review ≥2×; escalate ≥3×.", "Do not evaluate without an approved expected baseline.", "Full KYC; proof of address/second ID and SOF on escalation.", "Expected £1,000, actual £3,500: escalate (3.5×)."], ["R11", "Wallet cash deposits/withdrawals", "Single wallet cash-in/out ≥ £2,000 OR qualifying wallet cash activity ≥ £5,000 in rolling 24h.", "Review cash movements and supporting source evidence.", "Full KYC, proof of address/second ID, SOF.", "Wallet cash withdrawal £2,500: HIT."], ["R12", "Rapid wallet pass-through", "At least 80% of incoming wallet money exits within 2 hours in at least 3 qualifying matched events within 7 days.", "Requires linked incoming/outgoing events and timestamps; cannot be inferred from a single amount.", "Full KYC, SOF/SOW, counterparty review.", "Three events with 90%, 85%, 90% exit within 2h: HIT."], ["R13", "Wallet transfer frequency", "At least 8 wallet transfers in 24h OR at least 15 in 7d.", "Exclude failed and duplicate events.", "Full KYC; SOF if unusual.", "Nine qualifying wallet transfers in 24h: HIT."], ["R14", "Virtual account unrelated payers or receipts", "At least 3 unrelated payers in 7d OR qualifying virtual-account receipts ≥ £3,000 in 24h.", "Verify distinct unrelated payer identities and incoming values.", "Payer identity, account ownership, KYC and SOF.", "Three unrelated payers or £3,200 in 24h: HIT."], ["R15", "Virtual account onward movement", "At least 80% of qualifying incoming virtual-account value forwarded within 24h.", "Requires linked receipt and onward-payment records.", "Ownership, counterparties, SOF.", "£5,000 received, £4,200 forwarded in 24h: HIT (84%)."], ["R16", "FX conversion velocity/turnover", "At least 5 FX conversions in 24h OR GBP-equivalent FX turnover ≥ £10,000 in 7d.", "Count valid conversions and use consistent GBP-equivalent amounts.", "Full KYC; SOF if unusual.", "Six conversions today: HIT."], ["R17", "Repeated FX currency round trips", "At least 3 completed currency round trips within 24h (e.g. GBP→EUR→GBP).", "Requires linked conversion legs and economic-purpose assessment.", "Full KYC and economic-purpose review.", "Three completed GBP→EUR→GBP round trips in 24h: HIT."], ["R18", "Combined external-value activity", "Across qualifying NEC products, ≥£5,000/24h OR ≥£10,000/7d OR ≥£20,000/30d.", "Exclude internal transfers and avoid double-counting the same underlying value.", "Full KYC, proof of address/second ID and/or SOF.", "£3,000 P2P + £2,500 distinct external wallet activity in 24h: HIT."], ["R19", "New device, beneficiary and unusual transfer", "All three within 24h: new device AND new beneficiary AND unusual transfer.", "Check account takeover indicators and step-up verification.", "Step-up identity and device verification.", "New phone + new recipient + unusual transfer: HIT."], ["R20", "Dormant account reactivation", "No qualifying customer-initiated activity for ≥90 days AND new qualifying transfers ≥£2,000 within 24h.", "Requires trustworthy historical activity dates.", "Reverify KYC, SOF and transaction purpose.", "100 inactive days then £2,500 transfer: HIT."], ["M01", "Need-to-Know review", "A Medium-risk sender has a specific concern; Compliance marks Need-to-Know = Yes and documents rationale.", "Manual Compliance review; not an automatic hold solely due to Medium risk.", "Document reason, investigation and outcome.", "Medium-risk sender with unclear purpose: Compliance review."], ["M02", "Quality assurance sampling", "Select Medium-risk transactions for QA under an approved sampling plan.", "Check correct application of identity checks, screening and documentation; no automatic hold solely for QA.", "KYC evidence, screening and procedural records.", "Sample a Medium-risk transfer and record QA findings."]];

function readConds(){return [...document.querySelectorAll('#conds .cond')].map(x=>({field:x.querySelector('.cfield').value,op:x.querySelector('.cop').value,value:x.querySelector('.cvalue').value.trim()}))}
function csvParse(text){let rows=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function makeDecision(record){let t=clone(state.transactions[txIndex]);t.F=$('h-amount').value;t.E=$('h-product').value;let d=decision(t,$('h-kyc').value,$('h-screen').value,$('h-enh').value,$('h-other').value);$('h-result').innerHTML=`<div class="notice"><b>${pill(d.status)}</b><p>${esc(d.why)}</p><p><b>Active rule outcomes:</b> ${d.hits.map(x=>esc(x.r.id)+' '+esc(x.out)).join(', ')||'No active configured rule hits'}</p></div>`;if(record){state.decisions.unshift({date:new Date().toISOString(),tx:t.B,status:d.status,rules:d.hits.map(x=>x.r.id).join(',')});log('Simulated decision',t.B,d.status)}return d}

const v15OriginalEval=evalRule;
evalRule=function(r,t){if(!r)return 'UNMAPPED';if(r.legacy&&r.id==='R19'){
 if(String(t.E||'').toLowerCase()!=='p2p')return 'CLEAR';
 if(String(t.AE||'').toLowerCase()==='no'||String(t.AF||'').toLowerCase()==='no'||String(t.AG||'').toLowerCase()==='no')return 'CLEAR';
 if(['AE','AF','AG'].some(k=>t[k]===undefined||String(t[k]).trim()===''))return 'DATA REQUIRED';
 return ['AE','AF','AG'].every(k=>String(t[k]).toLowerCase()==='yes')?'HIT':'CLEAR';}
 if(r.legacy&&r.id==='R20'){
 let days=t.AH!==undefined&&String(t.AH).trim()!==''?t.AH:t.AF;
 let total=t.AI!==undefined&&String(t.AI).trim()!==''?t.AI:t.AG;
 if(days===undefined||total===undefined||String(days).trim()===''||String(total).trim()==='')return 'DATA REQUIRED';
 if(!Number.isFinite(Number(days))||!Number.isFinite(Number(total)))return 'DATA REQUIRED';
 return Number(days)>=90&&Number(total)>=2000?'HIT':'CLEAR';}
 return v15OriginalEval(r,t)
};

 let missingActive=matched.filter(x=>x.out==='DATA REQUIRED'&&x.r.action==='Hold'&&x.r.status==='Active'&&x.r.approval==='Approved');
 let blockers=[];if(String(d.amount).trim()===''||!Number.isFinite(Number(d.amount))||Number(d.amount)<0)blockers.push('Invalid transaction amount');
 if(dec.status!=='RELEASE ELIGIBLE')blockers.push(dec.why||dec.status);

 if(matched.some(x=>x.out==='DATA REQUIRED'&&x.r.status==='Active'&&x.r.approval==='Approved'))blockers.push('Approved active rules have unresolved inputs');
 return {actual,pass,dec,blockers,matched,rule:r,manual,tx:t}
};
function v15Events(d){let a=Number(d.amount)||0,p=d.product,rows=[],f=d.fields||{},base='2026-10-31T12:00:00Z';
 function add(offset,amt,product,beneficiary,kind='External'){rows.push({id:d.id+'-TX-'+(rows.length+1),time:new Date(Date.parse(base)+offset*3600000).toISOString(),product,amount:Math.max(0,Number(amt)||0).toFixed(2),beneficiary,kind})}
 if(p==='P2P'){
  let cnt=Math.max(1,Math.min(25,Number(f.M)||1)),total=Math.max(a,Number(f.J)||a),previous=Math.max(0,total-a),distinct=Math.max(1,Math.min(20,Number(f.N)||1));
  for(let i=0;i<cnt-1;i++)add(-Math.min(23,cnt-i),previous/(cnt-1),'P2P','BEN-'+(i%distinct+1));add(0,a,'P2P','BEN-'+distinct);
  if(Number(f.K)>total)add(-96,Number(f.K)-total,'P2P','BEN-OLDER');if(Number(f.L)>Math.max(Number(f.K)||0,total))add(-360,Number(f.L)-Math.max(Number(f.K)||0,total),'P2P','BEN-MONTH');
 }else if(p==='Wallet'){let cnt=Math.max(1,Math.min(20,Number(f.T)||1)),total=Math.max(a,Number(f.Q)||a);for(let i=0;i<cnt-1;i++)add(-Math.min(23,cnt-i),(total-a)/(cnt-1),'Wallet','WALLET-RECIPIENT');add(0,a,'Wallet','WALLET-RECIPIENT')}
 else if(p==='Virtual Account'){let cnt=Math.max(1,Math.min(15,Number(f.V)||1)),total=Math.max(a,Number(f.W)||a);for(let i=0;i<cnt-1;i++)add(-Math.min(23,cnt-i),(total-a)/(cnt-1),'Virtual Account','PAYER-'+(i+1),'Incoming');add(0,a,'Virtual Account','PAYER-'+cnt,'Incoming')}
 else{let cnt=Math.max(1,Math.min(20,Number(f.Y)||1));for(let i=0;i<cnt-1;i++)add(-Math.min(23,cnt-i),a,'FX','FX-CONVERSION','Conversion');add(0,a,'FX','FX-CONVERSION','Conversion')}
 return rows;
}

function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(panels))}catch(_){}}
function snapshot(){const x={};root.querySelectorAll('details').forEach(el=>x[keyFor(el)]=el.open);return x}
function apply(snap){root.querySelectorAll('details').forEach(el=>{let key=keyFor(el);if(Object.prototype.hasOwnProperty.call(snap,key))el.open=!!snap[key];else if(Object.prototype.hasOwnProperty.call(panels,key))el.open=!!panels[key]})}
function save(){Object.assign(panels,snapshot());persist()}
// Save each accordion independently, including clicks that do not modify a field.
root.addEventListener('toggle',e=>{if(e.target.tagName!=='DETAILS')return;const key=keyFor(e.target);panels[key]=e.target.open;persist()},true);
// Capture state before the legacy handler rebuilds the entire content node.
root.addEventListener('click',e=>{let btn=e.target.closest('[data-wb],[data-act],[data-v13-action]');if(!btn)return;const before=snapshot();const y=window.scrollY;const focused=document.activeElement?.id;const oldTab=currentTab();queueMicrotask(()=>{if(currentTab()!==oldTab)return;apply(before);save();if(oldTab==='Test & Release Workbench'||oldTab==='Rule Builder'){window.scrollTo({top:y,behavior:'instant'});if(focused&&document.getElementById(focused)&&focused.startsWith('wb-')){let el=document.getElementById(focused);el.focus({preventScroll:true})}}})},true);
// A case switch rerenders without clicking a button.
root.addEventListener('change',e=>{if(e.target.id!=='wb-pick')return;const before=snapshot();const y=window.scrollY;queueMicrotask(()=>{apply(before);save();window.scrollTo({top:y,behavior:'instant'})})},true);
// Keep open states across navigation, not just within the current page.
document.getElementById('nav').addEventListener('click',()=>{save();queueMicrotask(()=>{apply(panels)})},true);
// The existing app saves workbench edits on input. Persist immediately after every edit
// so a browser refresh doesn't discard work that wasn't explicitly saved as a custom case.
root.addEventListener('input',e=>{if(!e.target.matches('[id^="wb-"]'))return;queueMicrotask(()=>{try{let stored=localStorage.getItem('NEC_V14_WORKBENCH');if(stored){let data=JSON.parse(stored);data.lastEditedAt=new Date().toISOString();localStorage.setItem('NEC_V14_WORKBENCH',JSON.stringify(data))}}catch(_){}})},false);
apply(panels);
})();
</script>
</body></html>
